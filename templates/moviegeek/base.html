<!DOCTYPE html>
<html lang="en">
  <head>
    {% load static %}
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopGEEKs — Office & School Supplies</title>

    <!-- Bootstrap -->
    <link href="http://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="http://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap-theme.min.css" rel="stylesheet">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.2/jquery.min.js"></script>
    <script src="http://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
    <script src="{% static 'js/collector.js' %}"></script>
    <script>
        function get_url(itemid) {
            return '/movies/api/item/' + itemid + '/';
        }
    </script>
    <style>
        body { margin: 0; padding: 0; }
        .sidebar-fixed {
            position: fixed;
            top: 50px;
            bottom: 0;
            left: 0;
            width: 220px;
            overflow-y: auto;
            padding: 10px 5px 10px 10px;
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            z-index: 100;
        }
        .sidebar-fixed .nav-sidebar li a {
            font-size: 12px;
            padding: 3px 8px;
            color: #333;
        }
        .sidebar-fixed .nav-sidebar li a:hover {
            background: #e0e0e0;
        }
        .main-content {
            margin-left: 230px;
            padding: 10px 15px;
        }
    </style>

      {% block head %}{% endblock head %}
</head>
<body>
    <div class="container-fluid" style="padding:0;">
        <nav class="navbar navbar-inverse" style="margin-bottom: 0; border-radius: 0;">
            <div class="navbar-header">
                <a class="navbar-brand" href="/">Shop GEEKs</a>
                <a class="navbar-text" href="/analytics/user/{{user_id}}/">User: {{ user_id }} </a>
            </div>
            <div class="nav nav-pills pull-right">
                <form class="navbar-form" action="/movies/search/">
                    <div class="form-group" style="display:inline;">
                        <input type="text" class="form-control" placeholder="Поиск" name="q" style="background-color: gray;" maxlength="40">
                        <button class="input-group-addon" style="width: 40px"><i class="glyphicon glyphicon-search" title="Search"></i></button>
                    </div>
                </form>
            </div>
        </nav>

        <div class="sidebar-fixed">
            <strong>Категории</strong>
            <ul class="nav nav-sidebar">
            {% if genres %}
            {% for genre in genres %}
                <li><a href="/movies/genre/{{genre.name}}">{{ genre.name_ru }}</a></li>
            {% endfor %}
            {% endif %}
            </ul>
        </div>

        <div class="main-content">
            {% block content %}{% endblock content %}
        </div>
    </div>
</body>
</html>
